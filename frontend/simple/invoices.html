<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Invoices</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;max-width:900px;margin:32px auto;padding:0 16px}
    table{width:100%;border-collapse:collapse}
    th,td{border:1px solid #ddd;padding:8px}
    th{background:#f7f7f7}
    .ok{color:green}.bad{color:#b00020}
  </style>
</head>
<body>
  <h1>Saved Invoices</h1>
  <table id="tbl">
    <thead><tr>
      <th>ID</th><th>Vendor Email</th><th>Company</th><th>Invoice</th><th>Receipts</th><th>Delta</th><th>Status</th><th>Created</th>
    </tr></thead>
    <tbody></tbody>
  </table>

  <script>
    const API = "http://localhost:3001/api/invoices";
    async function load() {
      const res = await fetch(API);
      const json = await res.json();
      const rows = json.data || [];
      const tbody = document.querySelector("#tbl tbody");
      tbody.innerHTML = rows.map(r => `
        <tr>
          <td><a href="invoice.html?id=${r.id}">${r.id}</a></td>
          <td>${r.vendorEmail ?? ""}</td>
          <td>${r.company ?? ""}</td>
          <td>$${Number(r.invoiceTotal).toFixed(2)}</td>
          <td>$${Number(r.receiptsTotal).toFixed(2)}</td>
          <td>$${Number(r.delta).toFixed(2)}</td>
          <td>${r.pass ? '<b class="ok">PASS</b>' : '<b class="bad">FAIL</b>'}</td>
          <td>${r.createdAt}</td>
        </tr>
      `).join("");
    }
    load();
  </script>
</body>
</html>
